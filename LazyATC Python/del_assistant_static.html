<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LazyATC (Static)</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #101a2f;
      --panel-border: #223251;
      --text: #e7ecf8;
      --muted: #9db0d1;
      --accent: #62a5ff;
      --success: #4ade80;
      --error: #f87171;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, #0b1220 0%, #12213f 100%);
      color: var(--text);
    }

    .app {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--panel-border);
      background: rgba(16, 26, 47, 0.94);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .mode-group {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .mode-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      background: #0f1a33;
    }

    .section { display: none; }

    label {
      display: block;
      margin: 10px 0 6px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    input, select, textarea, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      background: #0d162c;
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(98, 165, 255, 0.2);
    }

    select { min-height: 120px; }
    textarea { height: 110px; resize: vertical; }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      background: linear-gradient(135deg, #2f8cff 0%, #3572ff 100%);
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.08s ease, filter 0.15s ease;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }

    #route-status {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      color: var(--muted);
      background: #0d162c;
    }

    #route-status.valid {
      border-color: rgba(74, 222, 128, 0.45);
      color: #c3f7d7;
      background: rgba(74, 222, 128, 0.12);
    }

    #route-status.invalid {
      border-color: rgba(248, 113, 113, 0.45);
      color: #ffd4d4;
      background: rgba(248, 113, 113, 0.12);
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>LazyATC</h1>
    <p class="subtitle">Static helper for route and altitude coordination.</p>

    <div class="mode-group">
      <label class="mode-option">
        <input type="radio" name="mode" value="Invalid Route" checked> Invalid Route
      </label>
      <label class="mode-option">
        <input type="radio" name="mode" value="Non-Standard Altitude"> Non-Standard Altitude
      </label>
    </div>

    <div id="route-section" class="section">
      <label for="dept">Departure Airport</label>
      <input type="text" id="dept" placeholder="e.g. YSSY" maxlength="4" pattern="[A-Za-z]{4}">

      <label for="dest">Destination Airport</label>
      <input type="text" id="dest" placeholder="e.g. YBBN" maxlength="4" pattern="[A-Za-z]{4}">

      <label for="filed-route">Filed Route to Check</label>
      <input type="text" id="filed-route" placeholder="Enter full filed route">

      <div class="button-row">
        <button onclick="fetchRoutes()">Get Routes</button>
        <button onclick="checkRoute()">Check Route</button>
      </div>

      <div id="route-status">No route check performed yet.</div>

      <label for="route-list">Available Routes</label>
      <select id="route-list" size="5"></select>

      <label for="override">Override Route</label>
      <input type="text" id="override" placeholder="Optional manual amended route">
    </div>

    <div id="altitude-section" class="section">
      <label for="filed-fl">Filed Flight Level</label>
      <input type="number" id="filed-fl" placeholder="e.g. 330">
    </div>

    <button onclick="generateMessage()">Generate Message</button>

    <label for="output">Generated Message</label>
    <textarea id="output" readonly></textarea>
    <button onclick="copyMessage()">📋 Copy to Clipboard</button>
  </main>

<script>
  const templates = {
    "Invalid Route": "Hi, your planned route seems to be invalid. Can you accept amended routing via {route}?",
    "Non-Standard Altitude": "Hi, your altitude is non-standard. I can offer you either {fl1} or {fl2}."
  };
  const ROUTES_API_BASE_URL = "https://api.chrisgardiner.org/routes";

  const routeStatus = document.getElementById("route-status");

  document.querySelectorAll('input[name="mode"]').forEach(r => {
    r.addEventListener("change", updateMode);
  });

  function updateMode() {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    document.getElementById("route-section").style.display = mode === "Invalid Route" ? "block" : "none";
    document.getElementById("altitude-section").style.display = mode === "Non-Standard Altitude" ? "block" : "none";
  }

  async function getRoutesForPair() {
    const dept = document.getElementById("dept").value.trim().toUpperCase();
    const dest = document.getElementById("dest").value.trim().toUpperCase();

    if (!dept || !dest) {
      alert("Please enter both departure and destination airports.");
      return null;
    }
    if (!/^[A-Z]{4}$/.test(dept) || !/^[A-Z]{4}$/.test(dest)) {
      alert("Please enter valid 4-letter ICAO airport codes.");
      return null;
    }

    const res = await fetch(
      `${ROUTES_API_BASE_URL}?dept=${encodeURIComponent(dept)}&dest=${encodeURIComponent(dest)}`
    );
    if (!res.ok) {
      throw new Error(`Route API request failed (${res.status})`);
    }
    const data = await res.json();
    return data.routes || [];
  }

  function renderRoutes(routes) {
    const list = document.getElementById("route-list");
    list.innerHTML = "";

    routes.forEach(r => {
      const option = document.createElement("option");
      option.value = r.route || "";
      option.textContent = `${r.acft || "Any"} | ${r.route || "(No route)"}`;
      list.appendChild(option);
    });
  }

  async function fetchRoutes() {
    try {
      const routes = await getRoutesForPair();
      if (!routes) return;
      renderRoutes(routes);
      routeStatus.className = "";
      routeStatus.textContent = routes.length
        ? `Loaded ${routes.length} route${routes.length === 1 ? "" : "s"}.`
        : "No routes found for this city pair.";
    } catch (err) {
      alert("Error fetching routes: " + err.message);
    }
  }

  function normalizeRoute(value) {
    return value.replace(/\s+/g, " ").trim().toUpperCase();
  }

  async function checkRoute() {
    const filedRouteRaw = document.getElementById("filed-route").value.trim();
    if (!filedRouteRaw) {
      alert("Please enter the filed route to check.");
      return;
    }

    try {
      const routes = await getRoutesForPair();
      if (!routes) return;

      const validRoutes = routes
        .map(r => r.route)
        .filter(Boolean);
      const filedRoute = normalizeRoute(filedRouteRaw);
      const isValid = validRoutes.some(r => normalizeRoute(r) === filedRoute);

      if (isValid) {
        routeStatus.className = "valid";
        routeStatus.textContent = "Filed route is valid for this city pair.";
      } else {
        routeStatus.className = "invalid";
        routeStatus.textContent = "Filed route does not match known valid routes. Showing suggested routes below.";
      }

      renderRoutes(routes);
    } catch (err) {
      alert("Error checking route: " + err.message);
    }
  }

  function generateMessage() {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    let message = "";

    if (mode === "Invalid Route") {
      const override = document.getElementById("override").value.trim();
      const selected = document.getElementById("route-list").value;
      const route = override || selected;
      if (!route) {
        alert("Please select or enter a route.");
        return;
      }
      message = templates["Invalid Route"].replace("{route}", route);
    } else if (mode === "Non-Standard Altitude") {
      const filed = parseInt(document.getElementById("filed-fl").value);
      if (isNaN(filed)) {
        alert("Please enter a valid flight level.");
        return;
      }
      const fl1 = "FL" + String(filed - 10).padStart(3, "0");
      const fl2 = "FL" + String(filed + 10).padStart(3, "0");
      message = templates["Non-Standard Altitude"]
                  .replace("{fl1}", fl1)
                  .replace("{fl2}", fl2);
    }

    document.getElementById("output").value = message;
  }

  function copyMessage() {
    const output = document.getElementById("output");
    output.select();
    navigator.clipboard.writeText(output.value)
      .then(() => alert("Copied to clipboard!"))
      .catch(() => {
        if (typeof document.execCommand === "function") {
          const copied = document.execCommand("copy");
          alert(copied ? "Copied to clipboard!" : "Unable to copy automatically. Please copy the message manually.");
          return;
        }
        alert("Unable to copy automatically. Please copy the message manually.");
      });
  }

  // Initialize
  updateMode();
</script>
</body>
</html>
